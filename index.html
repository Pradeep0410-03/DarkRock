<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Currency Converter</h1>
    <p class="subtitle">Get live exchange rates and convert instantly.</p>

    <form id="converter-form" class="converter-form">
      <label for="amount">Amount</label>
      <input id="amount" type="number" min="0" step="0.01" value="1" required />

      <div class="currency-row">
        <div class="field">
          <label for="from-currency">From</label>
          <select id="from-currency"></select>
        </div>

        <button id="swap-btn" type="button" aria-label="Swap currencies">⇄</button>

        <div class="field">
          <label for="to-currency">To</label>
          <select id="to-currency"></select>
        </div>
      </div>

      <button class="convert-btn" type="submit">Convert</button>
    </form>

    <section id="result" class="result" aria-live="polite">
      Enter values and click Convert.
    </section>
  </main>

  <script src="file.js"></script>
</body>
</html>
